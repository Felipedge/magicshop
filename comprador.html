<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic - Shop</title>
</head>

<body>
    <header>
        <!-- Navbar -->
        <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <a class="navbar-brand d-flex align-items-center" href="main.html">
                    <img src="img/logo.png" alt="Logo" width="70" height="24" class="d-inline-block align-text-top me-2">
                    Magic-Shop
                </a>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3" id="saludoUsuario"></span>

                    <button class="btn btn-outline-light me-3 position-relative" type="button" id="cartBtn"
                        data-bs-toggle="offcanvas" data-bs-target="#resumenCompra">
                        🛒 Carrito
                        <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle" id="cartCount">0</span>
                    </button>

                    <form class="d-flex me-3" role="search" id="searchForm">
                        <label for="searchInput" class="visually-hidden">Buscar carta</label>
                        <input class="form-control me-2" type="search" placeholder="Buscar carta..."
                            aria-label="Buscar carta" id="searchInput" autocomplete="off" />
                        <button class="btn btn-outline-success" type="submit">Buscar</button>
                    </form>

                    <button class="btn btn-outline-danger" type="button" id="btnCerrarSesion">Cerrar sesión</button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Carrusel -->
        <section aria-label="Cartas destacadas">
            <div id="carouselExampleIndicators" class="carousel slide">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="img/imagen3.jpeg" class="d-block w-100" alt="Carta3 " />
                    </div>
                    <div class="carousel-item">
                        <img src="img/imagen1.jpeg" class="d-block w-100" alt="Carta1 " />
                    </div>
                    <div class="carousel-item">
                        <img src="img/imagen2.jpg" class="d-block w-100" alt="Carta2 " />
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </section>

        <!-- Video institucional -->
        <section class="container my-4">
            <h2 class="mb-3">¿Cómo comprar en Magic-Shop?</h2>
            <div class="ratio ratio-16x9" style="max-width: 720px;">
                <iframe src="https://www.youtube.com/embed/HYfDJBsnhTo" title="Cómo comprar en Magic-Shop"
                    allowfullscreen></iframe>
            </div>
        </section>

        <!-- Cards -->
        <section class="container my-4">
            <h2 class="mb-3" id="cardsTitle">Cartas disponibles</h2>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="cardsGrid"></div>

            <!-- Paginador -->
            <nav class="mt-4" aria-label="Paginación de cartas">
                <ul class="pagination justify-content-center">
                    <li class="page-item" id="pagAnteriorItem">
                        <button class="page-link" id="btnPagAnterior">Anterior</button>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" id="pagActualLabel">Página 1</span>
                    </li>
                    <li class="page-item" id="pagSiguienteItem">
                        <button class="page-link" id="btnPagSiguiente">Siguiente</button>
                    </li>
                </ul>
            </nav>
        </section>
    </main>

    <!-- Modal de detalle -->
    <div class="modal fade" id="detalleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="detalleModalTitle">Nombre de la carta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body d-flex gap-3">
                    <img id="detalleModalImg" src="" alt="" style="width: 160px; height: auto; border-radius: 6px;">
                    <div>
                        <p class="mb-1"><strong>Edición:</strong> <span id="detalleModalSet"></span></p>
                        <p class="mb-1"><strong>Tipo:</strong> <span id="detalleModalType"></span></p>
                        <p class="mb-1"><strong>Rareza:</strong> <span id="detalleModalRarity"></span></p>
                        <p class="mb-1"><strong>Precio:</strong> <span id="detalleModalPrecio"></span></p>
                        <p class="mb-1"><strong>Stock:</strong> <span id="detalleModalStock"></span></p>
                        <p class="mb-0 small text-muted" id="detalleModalTexto"></p>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-primary" id="detalleModalAgregar">Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Resumen de compra -->
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="resumenCompra">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title">Resumen de compra</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="resumenItems" class="flex-grow-1">
                <p class="text-muted">Tu carrito está vacío.</p>
            </div>
            <hr class="border-secondary">
            <div class="d-flex justify-content-between mb-3">
                <strong>Total</strong>
                <strong id="resumenTotal">$0</strong>
            </div>
            <button class="btn btn-success w-100" id="btnFinalizarCompra">Finalizar compra</button>
        </div>
    </div>

    <footer class="border-top py-3 mt-4">
        <div class="container text-center text-muted small">
            Magic-Shop &copy; 2026 — Proyecto académico, no es un servicio de venta real.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        (function () {
            // ---------- SESIÓN ----------
            const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
            if (!usuario || usuario.role !== "comprador") {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("saludoUsuario").textContent = `Hola, ${usuario.nombre || usuario.email}`;
            document.getElementById("btnCerrarSesion").addEventListener("click", () => {
                localStorage.removeItem("usuario");
                window.location.href = "login.html";
            });

            const API_BASE = "https://api.magicthegathering.io/v1/cards";
            const grid = document.getElementById("cardsGrid");
            const title = document.getElementById("cardsTitle");
            const searchForm = document.getElementById("searchForm");
            const searchInput = document.getElementById("searchInput");
            const cartCountEl = document.getElementById("cartCount");
            const PAGE_SIZE = 8;
            const API_FETCH_SIZE = 20; // se piden más de las que se muestran, por si algunas no tienen imagen

            let paginaActual = 1;
            let consultaActual = "";
            let ultimaCantidadResultados = 0;
            let cartasActuales = [];

            // ---------- INVENTARIO / ELIMINADAS (definidos por el admin) ----------
            function leerInventario() {
                return JSON.parse(localStorage.getItem("inventario") || "{}");
            }
            function leerEliminadas() {
                return JSON.parse(localStorage.getItem("eliminadas") || "[]");
            }

            function obtenerDatosInventario(carta) {
                const inv = leerInventario();
                if (inv[carta.id]) return inv[carta.id];

                const base = {
                    "Common": 500, "Uncommon": 1000, "Rare": 3000, "Mythic Rare": 8000
                }[carta.rarity] || 800;
                let hash = 0;
                for (let i = 0; i < carta.id.length; i++) hash += carta.id.charCodeAt(i);
                return { precio: base + (hash % 500), stock: 10 };
            }

            function formatoCLP(numero) {
                return numero.toLocaleString("es-CL", { style: "currency", currency: "CLP" });
            }

            // ---------- CARRITO ----------
            function leerCarrito() {
                return JSON.parse(localStorage.getItem("carrito") || "[]");
            }
            function guardarCarrito(carrito) {
                localStorage.setItem("carrito", JSON.stringify(carrito));
                actualizarContadorCarrito();
                renderResumenCompra();
            }
            function actualizarContadorCarrito() {
                const carrito = leerCarrito();
                cartCountEl.textContent = carrito.reduce((sum, item) => sum + item.qty, 0);
            }

            function agregarAlCarrito(carta) {
                const datos = obtenerDatosInventario(carta);
                if (datos.stock <= 0) return;

                const carrito = leerCarrito();
                const existente = carrito.find(item => item.id === carta.id);
                const cantidadEnCarrito = existente ? existente.qty : 0;
                if (cantidadEnCarrito >= datos.stock) return;

                if (existente) {
                    existente.qty += 1;
                } else {
                    carrito.push({ id: carta.id, name: carta.name, image: carta.imageUrl, price: datos.precio, qty: 1 });
                }
                guardarCarrito(carrito);
            }

            function cambiarCantidadCarrito(id, delta) {
                const carrito = leerCarrito();
                const item = carrito.find(i => i.id === id);
                if (!item) return;

                const datos = leerInventario()[id];
                const stockDisponible = datos ? datos.stock : Infinity;

                item.qty += delta;
                if (item.qty > stockDisponible) item.qty = stockDisponible;
                if (item.qty <= 0) carrito.splice(carrito.indexOf(item), 1);
                guardarCarrito(carrito);
            }

            function renderResumenCompra() {
                const carrito = leerCarrito();
                const contenedor = document.getElementById("resumenItems");
                const totalEl = document.getElementById("resumenTotal");

                if (!carrito.length) {
                    contenedor.innerHTML = `<p class="text-muted">Tu carrito está vacío.</p>`;
                    totalEl.textContent = formatoCLP(0);
                    return;
                }

                contenedor.innerHTML = carrito.map(item => `
                    <div class="d-flex gap-2 align-items-center mb-3">
                        <img src="${item.image || ''}" style="width:40px;height:56px;object-fit:cover;border-radius:3px;">
                        <div class="flex-grow-1">
                            <div class="small">${item.name}</div>
                            <div class="d-flex align-items-center gap-2">
                                <button class="btn btn-sm btn-outline-light" data-accion="restar" data-id="${item.id}">−</button>
                                <span>${item.qty}</span>
                                <button class="btn btn-sm btn-outline-light" data-accion="sumar" data-id="${item.id}">+</button>
                            </div>
                        </div>
                        <div class="small">${formatoCLP(item.price * item.qty)}</div>
                    </div>
                `).join("");

                contenedor.querySelectorAll("[data-accion]").forEach(btn => {
                    btn.addEventListener("click", () => {
                        const delta = btn.dataset.accion === "sumar" ? 1 : -1;
                        cambiarCantidadCarrito(btn.dataset.id, delta);
                    });
                });

                const total = carrito.reduce((sum, item) => sum + item.price * item.qty, 0);
                totalEl.textContent = formatoCLP(total);
            }

            document.getElementById("btnFinalizarCompra").addEventListener("click", () => {
                if (!leerCarrito().length) return;
                alert("¡Compra confirmada! Gracias por tu compra en Magic-Shop.");
                localStorage.setItem("carrito", "[]");
                actualizarContadorCarrito();
                renderResumenCompra();
                bootstrap.Offcanvas.getInstance(document.getElementById("resumenCompra"))?.hide();
            });

            // ---------- RENDER DE CARDS ----------
            function crearCard(carta) {
                const datos = obtenerDatosInventario(carta);
                carta.precio = datos.precio;
                carta.stock = datos.stock;

                const imagen = carta.imageUrl
                    ? `<img src="${carta.imageUrl}" class="card-img-top" alt="${carta.name}">`
                    : `<div class="d-flex align-items-center justify-content-center bg-secondary-subtle" style="height:300px;">
                         <span class="text-muted">Sin imagen</span>
                       </div>`;

                const sinStock = carta.stock <= 0;
                return `
                    <div class="col">
                        <article class="card h-100">
                            ${imagen}
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${carta.name}</h5>
                                <p class="card-text text-muted mb-1">${carta.setName || ""}</p>
                                <p class="card-text"><small class="text-muted">${carta.type || ""}</small></p>
                                <p class="card-text fw-bold">${formatoCLP(carta.precio)}</p>
                                <p class="card-text"><small class="${sinStock ? 'text-danger' : 'text-muted'}">
                                    ${sinStock ? 'Sin stock' : 'Stock: ' + carta.stock}
                                </small></p>
                                <div class="mt-auto d-flex gap-2">
                                    <button class="btn btn-outline-secondary btn-sm flex-fill" type="button" data-accion="detalle" data-id="${carta.id}">Detalle</button>
                                    <button class="btn btn-outline-primary btn-sm flex-fill" type="button"
                                        data-accion="agregar" data-id="${carta.id}" ${sinStock ? "disabled" : ""}>Agregar</button>
                                </div>
                            </div>
                        </article>
                    </div>`;
            }

            function renderCards(cartas) {
                cartasActuales = cartas;
                if (!cartasActuales.length) {
                    grid.innerHTML = `<p class="text-muted">No se encontraron cartas.</p>`;
                    return;
                }
                grid.innerHTML = cartasActuales.map(crearCard).join("");

                grid.querySelectorAll('[data-accion="agregar"]').forEach(btn => {
                    btn.addEventListener("click", () => {
                        const carta = cartasActuales.find(c => c.id === btn.dataset.id);
                        agregarAlCarrito(carta);
                        renderCards(cartasActuales);
                    });
                });
                grid.querySelectorAll('[data-accion="detalle"]').forEach(btn => {
                    btn.addEventListener("click", () => {
                        const carta = cartasActuales.find(c => c.id === btn.dataset.id);
                        abrirDetalle(carta);
                    });
                });
            }

            // ---------- MODAL DETALLE ----------
            const detalleModal = new bootstrap.Modal(document.getElementById("detalleModal"));
            let cartaEnDetalle = null;

            function abrirDetalle(carta) {
                cartaEnDetalle = carta;
                document.getElementById("detalleModalTitle").textContent = carta.name;
                document.getElementById("detalleModalImg").src = carta.imageUrl || "";
                document.getElementById("detalleModalSet").textContent = carta.setName || "—";
                document.getElementById("detalleModalType").textContent = carta.type || "—";
                document.getElementById("detalleModalRarity").textContent = carta.rarity || "—";
                document.getElementById("detalleModalPrecio").textContent = formatoCLP(carta.precio);
                document.getElementById("detalleModalStock").textContent = carta.stock;
                document.getElementById("detalleModalTexto").textContent = carta.text || "";
                detalleModal.show();
            }

            document.getElementById("detalleModalAgregar").addEventListener("click", () => {
                if (cartaEnDetalle) {
                    agregarAlCarrito(cartaEnDetalle);
                    detalleModal.hide();
                }
            });

            // ---------- CARGA / PAGINADOR ----------
            function actualizarPaginador() {
                document.getElementById("pagActualLabel").textContent = `Página ${paginaActual}`;
                document.getElementById("pagAnteriorItem").classList.toggle("disabled", paginaActual <= 1);
                document.getElementById("pagSiguienteItem").classList.toggle("disabled", ultimaCantidadResultados < API_FETCH_SIZE);
            }

            function cargarPagina() {
                title.textContent = consultaActual ? `Resultados para "${consultaActual}"` : "Cartas disponibles";
                grid.innerHTML = `<p class="text-muted">Cargando cartas...</p>`;

                const eliminadas = leerEliminadas();
                let url = `${API_BASE}?page=${paginaActual}&pageSize=${API_FETCH_SIZE}`;
                if (consultaActual) url += `&name=${encodeURIComponent(consultaActual)}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        const cartas = (data.cards || []).filter(c => c.imageUrl && !eliminadas.includes(c.id));
                        ultimaCantidadResultados = (data.cards || []).length;
                        renderCards(cartas.slice(0, PAGE_SIZE));
                        actualizarPaginador();
                    })
                    .catch(() => {
                        grid.innerHTML = `<p class="text-danger">No se pudo conectar con la API.</p>`;
                    });
            }

            document.getElementById("btnPagAnterior").addEventListener("click", () => {
                if (paginaActual > 1) { paginaActual--; cargarPagina(); }
            });
            document.getElementById("btnPagSiguiente").addEventListener("click", () => {
                if (ultimaCantidadResultados >= PAGE_SIZE) { paginaActual++; cargarPagina(); }
            });

            searchForm.addEventListener("submit", function (e) {
                e.preventDefault();
                consultaActual = searchInput.value.trim();
                paginaActual = 1;
                cargarPagina();
            });

            actualizarContadorCarrito();
            renderResumenCompra();
            cargarPagina();
        })();
    </script>
</body>

</html>
